name: Pytest
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "frontend/**"
      - "proto/**"
      - "buf.*"
      - "package*.json"
      - "vite.config.ts"
      - "hatch_build.py"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: libcairo2-dev libgirepository1.0-dev gir1.2-gst-plugins-base-1.0
          version: 1.0

      # Checkout & toolchain
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      # Install
      - name: Install (frozen)
        run: uv sync --frozen --group dev

      - name: Test application behavior and local SDK integration
        run: uv run --no-sync pytest -q

      - name: Test clean source and installed distributions
        run: uv run --no-sync pytest -m packaging -q
