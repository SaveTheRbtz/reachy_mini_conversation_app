name: Ruff
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "frontend/**"
      - "proto/**"
      - "buf.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - ".prettier*"
      - ".github/workflows/lint.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the Python API and test dependencies
        run: uv sync --frozen

      - name: Check types and run frontend tests
        run: npm test

      - name: Check protobuf schemas and generated code
        run: npm run check:generated

      - name: Install browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the SPA against the production backend
        run: npm run test:e2e

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install development tools
        run: uv sync --frozen --only-group dev --no-install-project

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .
