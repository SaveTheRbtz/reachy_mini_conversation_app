name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "src/**"
      - "tests/**"
      - "proto/**"
      - "buf.*"
      - "package*.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - ".prettier*"
      - ".gitattributes"
      - "hatch_build.py"
      - ".github/workflows/frontend.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build generated API, SPA, and Python distributions from source
        run: uv build

      - name: Check formatting, strict types, and protobuf schemas
        run: npm run check

      - name: Test frontend behavior
        run: npm run test:unit

      - name: Upload installable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist/
          retention-days: 7

  browser:
    name: browser and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          lfs: true

      - name: Install SDK system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: libcairo2-dev libgirepository1.0-dev gir1.2-gst-plugins-base-1.0
          version: 1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Test the generated Connect client against Python
        run: npm run test:integration

      - name: Install browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the packaged SPA against the production backend
        run: npm run test:e2e

      - name: Retain failed browser recordings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
