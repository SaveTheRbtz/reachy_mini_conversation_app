name: Sync to Hugging Face Space

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: hf-sync-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: production-hf-space

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build installable source
        run: |
          uv build --sdist
          mkdir -p dist/space
          tar -xzf dist/*.tar.gz --strip-components=1 -C dist/space

      - name: Sync GitHub to Hugging Face Hub
        uses: huggingface/hub-sync@da166beda9a9aff15d1de9a82c6dc86c410ea3ee  # v0.2.1
        with:
          github_repo_id: pollen-robotics/reachy_mini_conversation_app
          subdirectory: dist/space
          huggingface_repo_id: pollen-robotics/reachy_mini_conversation_app
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
